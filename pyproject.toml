[project]
name = "rekognition-video-face-blurring-cdk"
version = "0.1.0"
description = "A CDK application for blurring faces in video with Amazon Rekognition"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT-0"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stack"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.package-data]
stack = ["lambdas/**/*.py", "lambdas/**/Dockerfile", "lambdas/**/requirements.txt", "lambdas/**/.dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
